[project]
name = "argos"
version = "0.1.0"
description = "Agricultural Remote Gateway for Observation and Sensing"
authors = [
    { name = "GFAT", email = "gfat@ugr.es" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.59.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
argos = "argos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "mypy>=2.2.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "pytest-playwright",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
