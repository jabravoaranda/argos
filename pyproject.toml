[project]
name = "argos"
version = "0.1.0"
description = "Agricultural Remote Gateway for Observation and Sensing"
authors = [
    { name = "GFAT", email = "gfat@ugr.es" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "flower>=2.0.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "streamlit>=1.59.1",
]

[project.scripts]
argos = "argos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
